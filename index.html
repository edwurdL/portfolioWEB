<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- meta:start — scripts/prerender.mjs rewrites this block for each page;
       these defaults are what the dev server serves. -->
  <title>Eddie Lai — Portfolio</title>
  <meta name="description" content="Computer Engineering student at the University of Michigan. Projects in robotics, embedded systems, and software." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Eddie Lai" />
  <meta property="og:title" content="Eddie Lai — Portfolio" />
  <meta property="og:description" content="Computer Engineering student at the University of Michigan. Projects in robotics, embedded systems, and software." />
  <meta property="og:url" content="https://eddie-lai.com/" />
  <meta property="og:image" content="https://eddie-lai.com/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <!-- meta:end -->
  <!-- The photo API: the list is fetched with CORS, the images without, so
       each needs its own warmed connection. -->
  <link rel="preconnect" href="https://api.eddie-lai.com" crossorigin />
  <link rel="preconnect" href="https://api.eddie-lai.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Schibsted+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
  <!-- Sets the theme before first paint so there's no flash. The only place the
       saved theme is read; ThemeToggle takes it from the class on <html>. -->
  <script>
    let saved = null
    try { saved = localStorage.getItem('theme') } catch {} // throws when site data is blocked
    const dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
    if (dark) document.documentElement.classList.add('dark')
  </script>
  <script type="module" src="/src/main.tsx"></script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
