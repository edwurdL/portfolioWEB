<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="uml" width="880" height="650" viewBox="0 0 880 650" role="img" aria-labelledby="seq-title seq-desc"><title id="seq-title">Adding photos from the laptop</title><desc id="seq-desc">The laptop copies original photos into ~/photos/unprocessed on the Mac mini with rsync or scp over SSH, across the Tailscale network. A chokidar watcher on that folder fires once a file has stopped changing for two seconds, and queues it if it is a .jpg or .jpeg. The queue hands files to processPhoto one at a time. For each, processPhoto checks PostgreSQL for an existing entry; if one exists it deletes the original and skips it. Otherwise it reads the EXIF data with exifr, finds the top five colors with sharp, asks Ollama’s llava model for a description, category and tags, encodes a WebP of at most 350 KB into ~/photos/processed, deletes the original, and creates the photo’s row in PostgreSQL.</desc><style>/* UML diagrams in project posts (src/posts/diagrams.tsx). Colours are set here
   once, for both themes, so the SVG markup only names roles. */
.uml {
  --uml-ink: #27272a;
  --uml-muted: #71717a;
  --uml-line: #a1a1aa;
  --uml-node: #f4f4f5;
  --uml-node-side: #e4e4e7;
  --uml-part: #ffffff;
  --uml-accent: #0f766e;
  --uml-bg: #ffffff;
  font-family: 'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
}

.uml text { fill: var(--uml-ink); font-size: 12px; }
.uml .name { font-weight: 500; }
.uml .label { font-size: 11.5px; }
.uml .muted { fill: var(--uml-muted); font-size: 10.5px; }
.uml .stereo { fill: var(--uml-muted); font-size: 10.5px; font-style: italic; }
.uml .accent-text { fill: var(--uml-accent); }
.uml .halo { paint-order: stroke; stroke: var(--uml-bg); stroke-width: 4px; stroke-linejoin: round; }
.uml .node { fill: var(--uml-node); stroke: var(--uml-line); }
.uml .node-side { fill: var(--uml-node-side); stroke: var(--uml-line); stroke-linejoin: round; }
.uml .part { fill: var(--uml-part); stroke: var(--uml-line); }
.uml .edge { fill: none; stroke: var(--uml-line); stroke-width: 1.3; }
.uml .edge.accent { stroke: var(--uml-accent); stroke-width: 1.8; }
.uml .edge.dashed { stroke-dasharray: 5 4; }
.uml .lifeline { stroke: var(--uml-line); stroke-dasharray: 4 4; }
.uml .activation { fill: var(--uml-node); stroke: var(--uml-line); }
.uml .frame { fill: none; stroke: var(--uml-line); stroke-dasharray: 6 4; }
.uml .frame-tag { fill: var(--uml-node); stroke: var(--uml-line); }
.uml .divider { stroke: var(--uml-line); stroke-dasharray: 6 4; }
.uml .head { fill: var(--uml-line); }
.uml .head-accent { fill: var(--uml-accent); }
.uml .head-open { fill: none; stroke: var(--uml-line); stroke-width: 1.3; }
.uml .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
.uml .lane { fill: none; stroke: var(--uml-line); }
.uml .start { fill: var(--uml-ink); }
.uml .end-ring { fill: none; stroke: var(--uml-ink); stroke-width: 1.5; }
.uml .diamond { fill: var(--uml-ink); }

@media (prefers-color-scheme: dark) {
  .uml {
  --uml-ink: #e4e4e7;
  --uml-muted: #a1a1aa;
  --uml-line: #71717a;
  --uml-node: #27272a;
  --uml-node-side: #3f3f46;
  --uml-part: #18181b;
  --uml-accent: #2dd4bf;
  --uml-bg: #18181b;
}
}
.uml .bg { fill: var(--uml-bg); }
</style><rect class="bg" width="100%" height="100%"/><defs><marker id="seq-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="head"></path></marker><marker id="seq-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="head-accent"></path></marker><marker id="seq-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" class="head-open"></path></marker></defs><rect class="frame" x="148" y="10" width="728" height="630" rx="6"></rect><text class="stereo" x="160" y="26">«device» Mac mini</text><g><rect class="part" x="18" y="34" width="104" height="44" rx="3"></rect><text class="name" x="70" y="60" text-anchor="middle">Laptop</text><path class="lifeline" d="M70 78 V630"></path></g><g><rect class="part" x="158" y="34" width="104" height="44" rx="3"></rect><text class="name" x="210" y="52" text-anchor="middle">~/photos/</text><text class="name" x="210" y="67" text-anchor="middle">unprocessed</text><path class="lifeline" d="M210 78 V630"></path></g><g><rect class="part" x="288" y="34" width="104" height="44" rx="3"></rect><text class="name" x="340" y="52" text-anchor="middle">watcher</text><text class="name" x="340" y="67" text-anchor="middle">(chokidar)</text><path class="lifeline" d="M340 78 V630"></path></g><g><rect class="part" x="418" y="34" width="104" height="44" rx="3"></rect><text class="name" x="470" y="60" text-anchor="middle">processPhoto()</text><path class="lifeline" d="M470 78 V630"></path></g><g><rect class="part" x="548" y="34" width="104" height="44" rx="3"></rect><text class="name" x="600" y="60" text-anchor="middle">PostgreSQL</text><path class="lifeline" d="M600 78 V630"></path></g><g><rect class="part" x="660" y="34" width="104" height="44" rx="3"></rect><text class="name" x="712" y="52" text-anchor="middle">Ollama</text><text class="name" x="712" y="67" text-anchor="middle">(llava)</text><path class="lifeline" d="M712 78 V630"></path></g><g><rect class="part" x="766" y="34" width="104" height="44" rx="3"></rect><text class="name" x="818" y="52" text-anchor="middle">~/photos/</text><text class="name" x="818" y="67" text-anchor="middle">processed</text><path class="lifeline" d="M818 78 V630"></path></g><g><path class="edge accent" d="M70 112 H210" marker-end="url(#seq-accent)"></path><text class="label halo accent-text" x="140" y="105" text-anchor="middle">rsync / scp over SSH</text></g><text class="muted accent-text halo" x="140" y="128" text-anchor="middle">Tailscale tailnet</text><g><path class="edge " d="M210 160 H340" marker-end="url(#seq-arrow)"></path><text class="label halo " x="275" y="153" text-anchor="middle">‘add’ event</text></g><text class="muted halo" x="275" y="176" text-anchor="middle">after 2 s unchanged</text><g><path class="edge" d="M345 186 H372 V200 H347" marker-end="url(#seq-arrow)"></path><text class="label halo" x="380" y="197">queue it (.jpg / .jpeg only)</text></g><rect class="activation" x="465" y="232" width="10" height="380"></rect><g><path class="edge " d="M340 232 H465" marker-end="url(#seq-arrow)"></path><text class="label halo " x="402.5" y="225" text-anchor="middle">processPhoto(file)</text></g><text class="muted halo" x="405" y="248" text-anchor="middle">one at a time</text><g><path class="edge " d="M475 268 H600" marker-end="url(#seq-arrow)"></path><text class="label halo " x="537.5" y="261" text-anchor="middle">findFirst(filename)</text></g><g><path class="edge dashed" d="M600 292 H475" marker-end="url(#seq-open)"></path><text class="muted halo" x="537.5" y="286" text-anchor="middle">existing?</text></g><rect class="frame" x="162" y="306" width="700" height="312"></rect><path class="frame-tag" d="M162 306 H198 V318 L190 326 H162 Z"></path><text class="stereo" x="169" y="320">alt</text><text class="muted halo" x="214" y="322">[already in database]</text><g><path class="edge " d="M465 346 H210" marker-end="url(#seq-arrow)"></path><text class="label halo " x="337.5" y="339" text-anchor="middle">delete original · skip</text></g><path class="divider" d="M162 362 H862"></path><text class="muted halo" x="170" y="378">[new photo]</text><g><path class="edge" d="M475 392 H502 V406 H477" marker-end="url(#seq-arrow)"></path><text class="label halo" x="510" y="403">exifr: read EXIF</text></g><g><path class="edge" d="M475 428 H502 V442 H477" marker-end="url(#seq-arrow)"></path><text class="label halo" x="510" y="439">sharp: top 5 colors</text></g><g><path class="edge " d="M475 482 H712" marker-end="url(#seq-arrow)"></path><text class="label halo " x="593.5" y="475" text-anchor="middle">describe · categorize · tag</text></g><g><path class="edge dashed" d="M712 506 H475" marker-end="url(#seq-open)"></path><text class="muted halo" x="593.5" y="500" text-anchor="middle">JSON</text></g><g><path class="edge " d="M475 546 H818" marker-end="url(#seq-arrow)"></path><text class="label halo " x="646.5" y="539" text-anchor="middle">sharp: WebP ≤ 350 KB (quality search)</text></g><g><path class="edge " d="M465 574 H210" marker-end="url(#seq-arrow)"></path><text class="label halo " x="337.5" y="567" text-anchor="middle">delete original</text></g><g><path class="edge " d="M475 602 H600" marker-end="url(#seq-arrow)"></path><text class="label halo " x="537.5" y="595" text-anchor="middle">photo.create(…)</text></g></svg>
