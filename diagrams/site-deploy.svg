<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="uml" width="760" height="480" viewBox="0 0 760 480" role="img" aria-labelledby="ship-title ship-desc"><title id="ship-title">How a change goes live</title><desc id="ship-desc">I push to the portfolio-web repository on GitHub. Cloudflare Pages detects the push automatically and builds the site with pnpm build, which type-checks the code, bundles it with Vite and prerenders every page. Cloudflare Pages then deploys the built files to Cloudflare’s CDN, and eddie-lai.com serves the site globally.</desc><style>/* UML diagrams in project posts (src/posts/diagrams.tsx). Colours are set here
   once, for both themes, so the SVG markup only names roles. */
.uml {
  --uml-ink: #27272a;
  --uml-muted: #71717a;
  --uml-line: #a1a1aa;
  --uml-node: #f4f4f5;
  --uml-node-side: #e4e4e7;
  --uml-part: #ffffff;
  --uml-accent: #0f766e;
  --uml-bg: #ffffff;
  font-family: 'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
}

.uml text { fill: var(--uml-ink); font-size: 12px; }
.uml .name { font-weight: 500; }
.uml .label { font-size: 11.5px; }
.uml .muted { fill: var(--uml-muted); font-size: 10.5px; }
.uml .stereo { fill: var(--uml-muted); font-size: 10.5px; font-style: italic; }
.uml .accent-text { fill: var(--uml-accent); }
.uml .halo { paint-order: stroke; stroke: var(--uml-bg); stroke-width: 4px; stroke-linejoin: round; }
.uml .node { fill: var(--uml-node); stroke: var(--uml-line); }
.uml .node-side { fill: var(--uml-node-side); stroke: var(--uml-line); stroke-linejoin: round; }
.uml .part { fill: var(--uml-part); stroke: var(--uml-line); }
.uml .edge { fill: none; stroke: var(--uml-line); stroke-width: 1.3; }
.uml .edge.accent { stroke: var(--uml-accent); stroke-width: 1.8; }
.uml .edge.dashed { stroke-dasharray: 5 4; }
.uml .lifeline { stroke: var(--uml-line); stroke-dasharray: 4 4; }
.uml .activation { fill: var(--uml-node); stroke: var(--uml-line); }
.uml .frame { fill: none; stroke: var(--uml-line); stroke-dasharray: 6 4; }
.uml .frame-tag { fill: var(--uml-node); stroke: var(--uml-line); }
.uml .divider { stroke: var(--uml-line); stroke-dasharray: 6 4; }
.uml .head { fill: var(--uml-line); }
.uml .head-accent { fill: var(--uml-accent); }
.uml .head-open { fill: none; stroke: var(--uml-line); stroke-width: 1.3; }
.uml .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
.uml .lane { fill: none; stroke: var(--uml-line); }
.uml .start { fill: var(--uml-ink); }
.uml .end-ring { fill: none; stroke: var(--uml-ink); stroke-width: 1.5; }
.uml .diamond { fill: var(--uml-ink); }

@media (prefers-color-scheme: dark) {
  .uml {
  --uml-ink: #e4e4e7;
  --uml-muted: #a1a1aa;
  --uml-line: #71717a;
  --uml-node: #27272a;
  --uml-node-side: #3f3f46;
  --uml-part: #18181b;
  --uml-accent: #2dd4bf;
  --uml-bg: #18181b;
}
}
.uml .bg { fill: var(--uml-bg); }
</style><rect class="bg" width="100%" height="100%"/><defs><marker id="ship-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="head"></path></marker><marker id="ship-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="head-accent"></path></marker><marker id="ship-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" class="head-open"></path></marker></defs><g><rect class="lane" x="0" y="0" width="253.33333333333334" height="480"></rect><text class="name" x="126.66666666666667" y="24" text-anchor="middle">GitHub</text></g><g><rect class="lane" x="253.33333333333334" y="0" width="253.33333333333334" height="480"></rect><text class="name" x="380" y="24" text-anchor="middle">Cloudflare Pages</text></g><g><rect class="lane" x="506.6666666666667" y="0" width="253.33333333333334" height="480"></rect><text class="name" x="633.3333333333334" y="24" text-anchor="middle">Cloudflare CDN</text></g><path class="divider" d="M0 38 H760"></path><circle class="start" cx="126.66666666666667" cy="62" r="8"></circle><path class="edge" d="M126.66666666666667 70 V88" marker-end="url(#ship-arrow)"></path><g><rect class="part" x="31.66666666666667" y="88" width="190" height="50" rx="14"></rect><text class="name" x="126.66666666666667" y="109.5" text-anchor="middle">Push to portfolio-web</text><text class="muted" x="126.66666666666667" y="124.5" text-anchor="middle">git push</text></g><path class="edge accent" d="M221.66666666666669 113 H380 V156" marker-end="url(#ship-accent)"></path><text class="muted accent-text halo" x="293.33333333333337" y="106" text-anchor="middle">triggers automatically</text><g><rect class="part" x="280" y="156" width="200" height="44" rx="14"></rect><text class="name" x="380" y="182" text-anchor="middle">Detect the push</text></g><path class="edge" d="M380 200 V224" marker-end="url(#ship-arrow)"></path><g><rect class="part" x="280" y="224" width="200" height="64" rx="14"></rect><text class="name" x="380" y="245" text-anchor="middle">Build: pnpm build</text><text class="muted" x="380" y="260" text-anchor="middle">type-check · vite build</text><text class="muted" x="380" y="275" text-anchor="middle">prerender every page</text></g><path class="edge" d="M380 288 V312" marker-end="url(#ship-arrow)"></path><g><rect class="part" x="280" y="312" width="200" height="44" rx="14"></rect><text class="name" x="380" y="338" text-anchor="middle">Deploy built files</text></g><path class="edge" d="M480 334 H633.3333333333334 V380" marker-end="url(#ship-arrow)"></path><g><rect class="part" x="533.3333333333334" y="380" width="200" height="50" rx="14"></rect><text class="name" x="633.3333333333334" y="401.5" text-anchor="middle">Serve eddie-lai.com</text><text class="muted" x="633.3333333333334" y="416.5" text-anchor="middle">globally</text></g><path class="edge" d="M633.3333333333334 430 V446" marker-end="url(#ship-arrow)"></path><circle class="end-ring" cx="633.3333333333334" cy="456" r="10"></circle><circle class="start" cx="633.3333333333334" cy="456" r="6"></circle></svg>
