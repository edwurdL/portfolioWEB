<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="uml" width="760" height="590" viewBox="0 0 760 590" role="img" aria-labelledby="apideploy-title apideploy-desc"><title id="apideploy-title">How the API is deployed</title><desc id="apideploy-desc">A push to the main branch of the API repository starts a GitHub Actions workflow. Its runner installs cloudflared, sets up an SSH key, and connects to ssh.eddie-lai.com through Cloudflare Access. On the Mac mini it runs git pull, pnpm install, pnpm build and pnpm migrate, then reloads the API with pm2 (or starts dist/index.js if it isn’t running) and saves the pm2 process list.</desc><style>/* UML diagrams in project posts (src/posts/diagrams.tsx). Colours are set here
   once, for both themes, so the SVG markup only names roles. */
.uml {
  --uml-ink: #27272a;
  --uml-muted: #71717a;
  --uml-line: #a1a1aa;
  --uml-node: #f4f4f5;
  --uml-node-side: #e4e4e7;
  --uml-part: #ffffff;
  --uml-accent: #0f766e;
  --uml-bg: #ffffff;
  font-family: 'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
}

.uml text { fill: var(--uml-ink); font-size: 12px; }
.uml .name { font-weight: 500; }
.uml .label { font-size: 11.5px; }
.uml .muted { fill: var(--uml-muted); font-size: 10.5px; }
.uml .stereo { fill: var(--uml-muted); font-size: 10.5px; font-style: italic; }
.uml .accent-text { fill: var(--uml-accent); }
.uml .halo { paint-order: stroke; stroke: var(--uml-bg); stroke-width: 4px; stroke-linejoin: round; }
.uml .node { fill: var(--uml-node); stroke: var(--uml-line); }
.uml .node-side { fill: var(--uml-node-side); stroke: var(--uml-line); stroke-linejoin: round; }
.uml .part { fill: var(--uml-part); stroke: var(--uml-line); }
.uml .edge { fill: none; stroke: var(--uml-line); stroke-width: 1.3; }
.uml .edge.accent { stroke: var(--uml-accent); stroke-width: 1.8; }
.uml .edge.dashed { stroke-dasharray: 5 4; }
.uml .lifeline { stroke: var(--uml-line); stroke-dasharray: 4 4; }
.uml .activation { fill: var(--uml-node); stroke: var(--uml-line); }
.uml .frame { fill: none; stroke: var(--uml-line); stroke-dasharray: 6 4; }
.uml .frame-tag { fill: var(--uml-node); stroke: var(--uml-line); }
.uml .divider { stroke: var(--uml-line); stroke-dasharray: 6 4; }
.uml .head { fill: var(--uml-line); }
.uml .head-accent { fill: var(--uml-accent); }
.uml .head-open { fill: none; stroke: var(--uml-line); stroke-width: 1.3; }
.uml .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
.uml .lane { fill: none; stroke: var(--uml-line); }
.uml .start { fill: var(--uml-ink); }
.uml .end-ring { fill: none; stroke: var(--uml-ink); stroke-width: 1.5; }
.uml .diamond { fill: var(--uml-ink); }

@media (prefers-color-scheme: dark) {
  .uml {
  --uml-ink: #e4e4e7;
  --uml-muted: #a1a1aa;
  --uml-line: #71717a;
  --uml-node: #27272a;
  --uml-node-side: #3f3f46;
  --uml-part: #18181b;
  --uml-accent: #2dd4bf;
  --uml-bg: #18181b;
}
}
.uml .bg { fill: var(--uml-bg); }
</style><rect class="bg" width="100%" height="100%"/><defs><marker id="api-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="head"></path></marker><marker id="api-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="head-accent"></path></marker><marker id="api-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" class="head-open"></path></marker></defs><g><rect class="lane" x="0" y="0" width="190" height="590"></rect><text class="name" x="95" y="24" text-anchor="middle">GitHub</text></g><g><rect class="lane" x="190" y="0" width="190" height="590"></rect><text class="name" x="285" y="24" text-anchor="middle">Actions runner</text></g><g><rect class="lane" x="380" y="0" width="190" height="590"></rect><text class="name" x="475" y="24" text-anchor="middle">Cloudflare</text></g><g><rect class="lane" x="570" y="0" width="190" height="590"></rect><text class="name" x="665" y="24" text-anchor="middle">Mac mini</text></g><path class="divider" d="M0 38 H760"></path><circle class="start" cx="95" cy="62" r="8"></circle><path class="edge" d="M95 70 V88" marker-end="url(#api-arrow)"></path><g><rect class="part" x="10" y="88" width="170" height="50" rx="14"></rect><text class="name" x="95" y="109.5" text-anchor="middle">Push to main</text><text class="muted" x="95" y="124.5" text-anchor="middle">API repository</text></g><path class="edge" d="M180 113 H285 V150" marker-end="url(#api-arrow)"></path><text class="muted halo" x="220" y="106" text-anchor="middle">starts workflow</text><g><rect class="part" x="200" y="150" width="170" height="40" rx="14"></rect><text class="name" x="285" y="174" text-anchor="middle">Install cloudflared</text></g><path class="edge" d="M285 190 V214" marker-end="url(#api-arrow)"></path><g><rect class="part" x="200" y="214" width="170" height="40" rx="14"></rect><text class="name" x="285" y="238" text-anchor="middle">Set up SSH key</text></g><path class="edge" d="M285 254 V278" marker-end="url(#api-arrow)"></path><g><rect class="part" x="200" y="278" width="170" height="50" rx="14"></rect><text class="name" x="285" y="299.5" text-anchor="middle">SSH to the Mac mini</text><text class="muted" x="285" y="314.5" text-anchor="middle">ssh.eddie-lai.com</text></g><path class="edge accent" d="M370 303 H390" marker-end="url(#api-accent)"></path><g><rect class="part" x="390" y="278" width="170" height="50" rx="14"></rect><text class="name" x="475" y="299.5" text-anchor="middle">Cloudflare Access</text><text class="muted" x="475" y="314.5" text-anchor="middle">cloudflared access ssh</text></g><path class="edge accent" d="M560 303 H580" marker-end="url(#api-accent)"></path><g><rect class="part" x="580" y="278" width="170" height="50" rx="14"></rect><text class="name" x="665" y="299.5" text-anchor="middle">git pull</text><text class="muted" x="665" y="314.5" text-anchor="middle">pnpm install</text></g><path class="edge" d="M665 328 V352" marker-end="url(#api-arrow)"></path><g><rect class="part" x="580" y="352" width="170" height="50" rx="14"></rect><text class="name" x="665" y="373.5" text-anchor="middle">pnpm build</text><text class="muted" x="665" y="388.5" text-anchor="middle">pnpm migrate</text></g><path class="edge" d="M665 402 V426" marker-end="url(#api-arrow)"></path><g><rect class="part" x="580" y="426" width="170" height="50" rx="14"></rect><text class="name" x="665" y="447.5" text-anchor="middle">pm2 reload api</text><text class="muted" x="665" y="462.5" text-anchor="middle">or start dist/index.js</text></g><path class="edge" d="M665 476 V500" marker-end="url(#api-arrow)"></path><g><rect class="part" x="580" y="500" width="170" height="40" rx="14"></rect><text class="name" x="665" y="524" text-anchor="middle">pm2 save</text></g><path class="edge" d="M665 540 V556" marker-end="url(#api-arrow)"></path><circle class="end-ring" cx="665" cy="566" r="10"></circle><circle class="start" cx="665" cy="566" r="6"></circle></svg>
