<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="uml" width="830" height="352" viewBox="0 0 830 352" role="img" aria-labelledby="model-title model-desc"><title id="model-title">The photo data model</title><desc id="model-desc">On the Mac mini, Prisma’s Photo model in PostgreSQL holds an id, filename, url, description, category, tags, colors (the real colour of each of the photo’s main colour bands), an optional average colour, optional EXIF fields (date taken, camera, ISO, shutter, aperture, lens, focal length) and a creation time. GET /api/photos returns these rows as JSON, and the site’s mapPhoto function turns each into its own Photo type, taking the first colour as prominentColor and keeping avgColor, whose meta field holds a PhotoMeta with the camera settings, date and description.</desc><style>/* UML diagrams in project posts (src/posts/diagrams.tsx). Colours are set here
   once, for both themes, so the SVG markup only names roles. */
.uml {
  --uml-ink: #27272a;
  --uml-muted: #71717a;
  --uml-line: #a1a1aa;
  --uml-node: #f4f4f5;
  --uml-node-side: #e4e4e7;
  --uml-part: #ffffff;
  --uml-accent: #0f766e;
  --uml-bg: #ffffff;
  font-family: 'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
}

.uml text { fill: var(--uml-ink); font-size: 12px; }
.uml .name { font-weight: 500; }
.uml .label { font-size: 11.5px; }
.uml .muted { fill: var(--uml-muted); font-size: 10.5px; }
.uml .stereo { fill: var(--uml-muted); font-size: 10.5px; font-style: italic; }
.uml .accent-text { fill: var(--uml-accent); }
.uml .halo { paint-order: stroke; stroke: var(--uml-bg); stroke-width: 4px; stroke-linejoin: round; }
.uml .node { fill: var(--uml-node); stroke: var(--uml-line); }
.uml .node-side { fill: var(--uml-node-side); stroke: var(--uml-line); stroke-linejoin: round; }
.uml .part { fill: var(--uml-part); stroke: var(--uml-line); }
.uml .edge { fill: none; stroke: var(--uml-line); stroke-width: 1.3; }
.uml .edge.accent { stroke: var(--uml-accent); stroke-width: 1.8; }
.uml .edge.dashed { stroke-dasharray: 5 4; }
.uml .lifeline { stroke: var(--uml-line); stroke-dasharray: 4 4; }
.uml .activation { fill: var(--uml-node); stroke: var(--uml-line); }
.uml .frame { fill: none; stroke: var(--uml-line); stroke-dasharray: 6 4; }
.uml .frame-tag { fill: var(--uml-node); stroke: var(--uml-line); }
.uml .divider { stroke: var(--uml-line); stroke-dasharray: 6 4; }
.uml .head { fill: var(--uml-line); }
.uml .head-accent { fill: var(--uml-accent); }
.uml .head-open { fill: none; stroke: var(--uml-line); stroke-width: 1.3; }
.uml .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
.uml .lane { fill: none; stroke: var(--uml-line); }
.uml .start { fill: var(--uml-ink); }
.uml .end-ring { fill: none; stroke: var(--uml-ink); stroke-width: 1.5; }
.uml .diamond { fill: var(--uml-ink); }

@media (prefers-color-scheme: dark) {
  .uml {
  --uml-ink: #e4e4e7;
  --uml-muted: #a1a1aa;
  --uml-line: #71717a;
  --uml-node: #27272a;
  --uml-node-side: #3f3f46;
  --uml-part: #18181b;
  --uml-accent: #2dd4bf;
  --uml-bg: #18181b;
}
}
.uml .bg { fill: var(--uml-bg); }
</style><rect class="bg" width="100%" height="100%"/><defs><marker id="cls-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="head"></path></marker><marker id="cls-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="head-accent"></path></marker><marker id="cls-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" class="head-open"></path></marker></defs><g><rect class="part" x="20" y="20" width="270" height="312"></rect><text class="stereo" x="155" y="37" text-anchor="middle">«Prisma model» PostgreSQL</text><text class="name" x="155" y="54" text-anchor="middle">Photo</text><path class="edge" d="M20 64 H290"></path><text class="mono" x="32" y="82">id: String  {cuid}</text><text class="mono" x="32" y="98">filename: String</text><text class="mono" x="32" y="114">url: String</text><text class="mono" x="32" y="130">description: String</text><text class="mono" x="32" y="146">category: String</text><text class="mono" x="32" y="162">tags: String[]</text><text class="mono" x="32" y="178">colors: String[]</text><text class="mono" x="32" y="194">avgColor: String [0..1]</text><text class="mono" x="32" y="210">dateTaken: DateTime [0..1]</text><text class="mono" x="32" y="226">camera: String [0..1]</text><text class="mono" x="32" y="242">iso: Int [0..1]</text><text class="mono" x="32" y="258">shutter: String [0..1]</text><text class="mono" x="32" y="274">aperture: String [0..1]</text><text class="mono" x="32" y="290">lens: String [0..1]</text><text class="mono" x="32" y="306">focalLength: String [0..1]</text><text class="mono" x="32" y="322">createdAt: DateTime  {now()}</text></g><g><rect class="part" x="540" y="20" width="270" height="152"></rect><text class="stereo" x="675" y="37" text-anchor="middle">«TypeScript» src/types</text><text class="name" x="675" y="54" text-anchor="middle">Photo</text><path class="edge" d="M540 64 H810"></path><text class="mono" x="552" y="82">id: string</text><text class="mono" x="552" y="98">url: string [0..1]</text><text class="mono" x="552" y="114">ratio: string [0..1]</text><text class="mono" x="552" y="130">category: string [0..1]</text><text class="mono" x="552" y="146">prominentColor: string [0..1]</text><text class="mono" x="552" y="162">avgColor: string [0..1]</text></g><g><rect class="part" x="540" y="212" width="270" height="120"></rect><text class="stereo" x="675" y="229" text-anchor="middle">«TypeScript» src/types</text><text class="name" x="675" y="246" text-anchor="middle">PhotoMeta</text><path class="edge" d="M540 256 H810"></path><text class="mono" x="552" y="274">camera · lens · focalLength</text><text class="mono" x="552" y="290">aperture · shutterSpeed · iso</text><text class="mono" x="552" y="306">date · location · descriptor</text><text class="mono" x="552" y="322">(all optional)</text></g><path class="edge dashed accent" d="M290 96 H540" marker-end="url(#cls-accent)"></path><text class="label accent-text halo" x="415" y="86" text-anchor="middle">GET /api/photos  «JSON»</text><text class="muted halo" x="415" y="114" text-anchor="middle">mapPhoto() in src/lib/api.ts</text><path class="diamond" d="M675 172 L681 181 L675 190 L669 181 Z"></path><path class="edge" d="M675 190 V212" marker-end="url(#cls-arrow)"></path><text class="muted" x="686" y="206">meta 0..1</text></svg>
